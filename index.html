<!DOCTYPE html>
<html lang="es">
<link rel="stylesheet" href="style.css">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu tienda - descripción breve</title>
    <meta name="description" content="Camisetas y tazas con diseños originales. Envíos a todo Colombia.">
</head>

<body>
    <header>
        <h1>Nombre de tu tienda</h1>
        <nav>
              <a href="#inicio">Inicio</a>
  <a href="#productos">Productos</a>
  <a href="#contacto">Contacto</a>
        </nav>
    </header>
    <main>
        <section>
           <main> 
  <section>
    <h2>Productos destacados</h2>
    <div class="productos">
      <div class="producto">
        <img src="camiseta-montana.jpg" alt="Camiseta con diseño minimalista de montaña en tinta negra">
        <h3>Producto 1</h3>
        <p>$25.000</p>
        <button class="btn-agregar">Agregar al carrito</button>
      </div>
      <div class="producto">
        <img src="camiseta-montana.jpg" alt="Camiseta con diseño minimalista de montaña en tinta negra">
        <h3>Producto 2</h3>
        <p>$30.000</p>
        <button class="btn-agregar">Agregar al carrito</button>
      </div>
      <div class="producto">
        <img src="camiseta-montana.jpg" alt="Camiseta con diseño minimalista de montaña en tinta negra">
        <h3>Producto 3</h3>
        <p>$28.000</p>
        <button class="btn-agregar">Agregar al carrito</button>
      </div>
    </div>
  </section>
  <section id="contacto">
  <h2>Contáctanos</h2>
  <form id="formulario-contacto">
    <div class="campo">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre">
    </div>
    <div class="campo">
      <label for="email">Correo</label>
      <input type="text" id="email" name="email">
    </div>
    <div class="campo">
      <label for="mensaje">Mensaje</label>
      <textarea id="mensaje" name="mensaje" rows="4"></textarea>
    </div>
    <button type="submit">Enviar</button>
    <p id="mensaje-estado"></p>
  </form>
</section>
</main>
        </section>

    </main>

    <footer>

  <div class="footer-contenido">

    <div class="redes">
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>

    </div>
  </div>
</footer>
    </footer>

</html>
